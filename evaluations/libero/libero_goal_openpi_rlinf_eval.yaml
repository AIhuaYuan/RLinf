defaults:
  - env/libero_goal@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 0
    rollout: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_goal_openpi_rlinf_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 320
    max_steps_per_rollout_epoch: 3200
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "openpi_rlinf"
    model_path: "/path/to/pi0_libero_sft_rlinf_eval"
    precision: "bf16"
    is_lora: false
    lora_rank: 32
    pi05: False
    num_action_chunks: 5
    action_dim: 7
    use_proprio: True
    num_steps: 4
    add_value_head: False
    openpi_data:
      norm_stats_path: ${..model_path}/physical-intelligence/libero/norm_stats.json

    openpi:
      task: "eval"
      config_name: "pi0_libero"
      num_images_in_input: 2
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 48
      discrete_state_input: False
